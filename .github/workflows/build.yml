- name: Configure CMake
  run: |
    cmake -S . -B build \
      -DPICO_BOARD=pico2 \
      -DPICO_PLATFORM=rp2350 \
      -DPICO_SDK_PATH=${{ github.workspace }}/pico-sdk \
      -DNUKE_VERSION="${{ steps.ver.outputs.full }}"

- name: Build flash_nuke
  run: cmake --build build -j$(nproc)

- name: Verify UF2 size
  run: |
    UF2=build/flash_nuke.uf2
    SIZE=$(stat -c%s "$UF2")
    echo "UF2 size: $((SIZE/1024)) KB"
    # ต้องไม่เกิน 1 MB (sanity check)
    [ "$SIZE" -lt 1048576 ] || { echo "UF2 ใหญ่เกิน!"; exit 1; }
    arm-none-eabi-size build/flash_nuke.elf
